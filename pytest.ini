[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts = -q --tb=short
# pytest-timeout (requirements-dev.txt) makes @pytest.mark.timeout REAL and
# caps every test; long Society / fresh-install tests raise it per test.
# tests/test_pytest_timeout_plugin.py proves the plugin is loaded and enforces.
timeout = 900
# Warning policy (Phase 2.6 §11): a repo-owned deprecation that this
# hardening migrated away from can never silently re-enter — those classes
# are ERRORS. Third-party warnings are ignored only one at a time, narrowly,
# with the upstream reference in docs/adr/0003-prelive-deployment-hardening.md
# (D8). Never add a blanket `ignore::DeprecationWarning` here.
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
    error::pytest.PytestConfigWarning
    error::pydantic.warnings.PydanticDeprecatedSince20
    error:Valid config keys have changed in V2:UserWarning
    error::sqlalchemy.exc.MovedIn20Warning
    error:on_event is deprecated:DeprecationWarning
    # FastAPI/Starlette deprecation classes derive from UserWarning, not DeprecationWarning
    error:`regex` has been deprecated:UserWarning
    error:'HTTP_.* is deprecated:UserWarning
    error:websockets.legacy is deprecated:DeprecationWarning
    error:websockets.client.WebSocketClientProtocol is deprecated:DeprecationWarning
    error:websockets.WebSocketClientProtocol is deprecated:DeprecationWarning
    error:invalid escape sequence:DeprecationWarning
    error:invalid escape sequence:SyntaxWarning
    # passlib 1.7.4 imports the stdlib `crypt` module (removed in Python 3.13;
    # guarded by try/except, bcrypt does not need it). Images run 3.10, CI 3.11
    # — see ADR-0003 D8 for the runtime contract and the review trigger.
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils
    # starlette 1.6.0 TestClient uses the anyio 4.x alias anyio.abc.BlockingPortal
    # (starlette-side, no fix in the pinned release; harmless).
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
