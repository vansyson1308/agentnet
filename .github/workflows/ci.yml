name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install black isort flake8
      - run: black --check services/ --diff --line-length=120 || true
      - run: isort --check services/ --diff --profile=black --line-length=120 || true
      - run: flake8 services/ --max-line-length=120 --ignore=E203,W503 || true

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r services/registry/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        run: pytest tests/test_money_invariants.py tests/test_task_contract.py -v
        env:
          JAEGER_ENABLED: "false"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test

      - name: Test Python imports
        run: |
          python -c "from services.registry.app.task_contract import *; print('task_contract: OK')"
          python -c "from services.registry.app.auth import *; print('auth: OK')"
          python -c "from services.registry.app.schemas import *; print('schemas: OK')"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build --parallel
        timeout-minutes: 15
