name: CI

# Zero-known-blockers gates (Phase 2.5 §29). Every job is a hard gate: no
# `|| true`, no habitual --ignore. Skips are allowed only for the explicit,
# documented reasons checked by `scripts/ci/check_skips.py`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (runtime-failure classes are fatal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install black isort flake8
      # Hard gate: syntax errors, undefined names, unused-import shadowing,
      # invalid escapes — the classes that fail at runtime.
      - name: flake8 runtime-failure gate
        run: flake8 services/ tests/ sdk/ examples/ scripts/ --select=E9,F63,F7,F82,F821,F823 --max-line-length=120
      # Compile-time warnings (invalid escape sequences, ...) are errors. -f
      # forces a recompile so a cached .pyc can never hide one.
      - name: compile with warnings as errors
        run: python -W error -m compileall -q -f services/ sdk/ examples/ tests/ scripts/
      # Style is reported, not enforced (no large reformat by design).
      - name: style report (advisory)
        run: |
          black --check services/ tests/ --line-length=120 || echo "::warning::black would reformat files (advisory)"
          isort --check services/ tests/ --profile=black --line-length=120 || echo "::warning::isort would reorder imports (advisory)"

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # Resolves each service's pins (transitives included) against PyPI
      # advisories. PYSEC-2026-1325 (ecdsa timing side channel) has no
      # fixed release; ecdsa is only a fallback backend for python-jose and
      # AgentNet signs JWTs with HS256 — documented in ADR-0003.
      - name: audit service requirement sets
        run: |
          for req in services/registry/requirements.txt services/payment/requirements.txt services/worker/requirements.txt services/simulation/requirements.txt services/dashboard/requirements.txt; do
            echo "== $req"
            pip-audit -r "$req" --desc off --progress-spinner off --ignore-vuln PYSEC-2026-1325
          done

  dependency-coherence:
    name: Per-service isolated environments (pip check + import smoke on the images' Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"   # what services/*/Dockerfile ship (python:3.10-slim)
      - name: Build deps for ed25519 / psycopg2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libffi-dev python3-dev
      # The union interpreter is never the sole compatibility proof: every
      # service's requirements.txt is installed ALONE (exactly what its image
      # does), `pip check`ed, import-smoked, and shared runtime pins must
      # resolve identically across services.
      - name: Each service in its own environment
        run: bash scripts/ci/check_service_envs.sh
      # The SDK supports websockets 12 (classic client) through the current
      # release (asyncio client); prove both ends, not just the union env.
      - name: SDK at its minimum and current websockets
        run: bash scripts/ci/check_sdk_envs.sh

  test:
    name: Unit + PostgreSQL-backed + Society + migrations + compose topology
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agentnet
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: agentnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentnet -d agentnet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: agentnet_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET_KEY: ci-test-secret-key-32-chars-minimum-length-required
      JAEGER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the Builder sandbox + canary history scan need real git history
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build deps for ed25519 / psycopg2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libffi-dev python3-dev postgresql-client
      - name: Install the authoritative dev/test set (one resolver pass over every service pin)
        run: |
          pip install -r requirements-dev.txt
          pip check
          python -c "import pytest_timeout; print('pytest-timeout', pytest_timeout.__version__)"
      - name: Bootstrap the shared test database from the init-db bundle (fail hard)
        working-directory: services/registry
        run: python -m app.db_bootstrap --init-dir init-db
      - name: Migration matrix (fresh→head, pre-society→head, head no-op, downgrade/upgrade)
        run: bash deploy/society-migration-check.sh --mode local
      - name: Full test suite (no habitual exclusions)
        run: |
          pytest tests/ -v -rs \
            --ignore=tests/test_integration.py \
            --junitxml=pytest-report.xml \
            --cov=services --cov-report=term-missing --cov-report=xml
      - name: No unexplained skips
        run: python scripts/ci/check_skips.py pytest-report.xml --allow "fresh-install harness"
      - name: Deterministic Society end-to-end demo
        run: python examples/demo_autonomous_society.py
      - name: Upload coverage + report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            coverage.xml
            pytest-report.xml

  fresh-install:
    name: Fresh install → migrate → run → E2E → restart (persistence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agentnet
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentnet -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: testpass
      JAEGER_ENABLED: "false"
      AGENTNET_FRESH_INSTALL: "1"
      AGENTNET_FRESH_INSTALL_REPORT_DIR: fresh-install-reports
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Runtime deps (redis-server is started privately by the harness)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libffi-dev python3-dev redis-server postgresql-client
          sudo systemctl stop redis-server || true
      - name: Install the authoritative dev/test set (one resolver pass over every service pin)
        run: |
          pip install -r requirements-dev.txt
          pip check
          python -c "import pytest_timeout; print('pytest-timeout', pytest_timeout.__version__)"
      - name: Fresh-install proof (empty DB and pre-society snapshot)
        run: pytest tests/test_fresh_install.py -v -rs --junitxml=fresh-install-report.xml
      - name: No skips allowed here
        run: python scripts/ci/check_skips.py fresh-install-report.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fresh-install-report
          path: |
            fresh-install-report.xml
            fresh-install-reports/

  docker-build:
    name: Images build + compose projects render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - run: docker compose build --parallel
        timeout-minutes: 15
      # What ships is proven, not inferred: import each service's entry
      # module inside its built image (entrypoint bypassed, no DB/Redis).
      - name: Import smoke inside the built images
        run: bash scripts/ci/check_images.sh
      - name: Validate compose projects (local, demo overlay, staging, staging+shared-infra)
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.demo.yml config > /dev/null
          # Throwaway values generated per run: the staging project must render,
          # and no credential-shaped literal belongs in the repository.
          export POSTGRES_HOST=db.invalid POSTGRES_USER=render POSTGRES_PASSWORD="$(openssl rand -hex 8)" \
                 REDIS_HOST=redis.invalid REDIS_PASSWORD="$(openssl rand -hex 8)" JWT_SECRET_KEY="$(openssl rand -hex 16)" \
                 FLASK_SECRET_KEY="$(openssl rand -hex 16)" CORS_ALLOWED_ORIGINS=https://staging.invalid
          docker compose -f docker-compose.staging.yml config > /dev/null
          SHARED_INFRA_NETWORK=render-overlay docker compose -f docker-compose.staging.yml -f docker-compose.staging.shared-infra.yml config > /dev/null
      - name: Compose topology tests need only the CLI (ownership proven on rendered config)
        run: |
          pip install pytest pyyaml
          pytest tests/test_compose_topology.py -v -rs
