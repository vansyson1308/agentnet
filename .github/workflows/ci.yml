name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black isort flake8
      - run: black --check services/ tests/ --diff --line-length=120 || true
      - run: isort --check services/ tests/ --diff --profile=black --line-length=120 || true
      - run: flake8 services/ tests/ --max-line-length=120 --ignore=E203,W503,E501 || true

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agentnet
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: agentnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: agentnet_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET_KEY: ci-test-secret-key-32-chars-minimum-length-required
      JAEGER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps for ed25519
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libffi-dev python3-dev

      - name: Install dependencies
        run: |
          pip install -r services/registry/requirements.txt
          pip install -r services/payment/requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Apply DB schema (init-db SQL bundle)
        run: |
          for f in services/registry/init-db/*.sql; do
            echo "applying $f"
            PGPASSWORD=testpass psql -h localhost -U agentnet -d agentnet_test -v ON_ERROR_STOP=1 -f "$f" || true
          done

      - name: Run full test suite
        run: |
          pytest tests/ -v \
            --ignore=tests/test_simulation.py \
            --ignore=tests/test_simulation_escrow.py \
            --ignore=tests/test_simulation_seed.py \
            --ignore=tests/test_integration.py \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Test Python imports (no-db modules)
        run: |
          python -c "from services.registry.app.task_contract import *; print('task_contract: OK')"
          python -c "from services.registry.app.schemas import *; print('schemas: OK')"
          python -c "from services.registry.app.security import *; print('security: OK')"
          python -c "from services.registry.app.task_service import EscrowError, create_task_with_escrow, confirm_task_completion, fail_task_with_refund; print('task_service: OK')"
          python -c "from services.registry.app.health import install_health_and_metrics; print('health: OK')"
          python -c "from services.registry.app.logging_config import setup_logging; print('logging_config: OK')"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build --parallel
        timeout-minutes: 15

      - name: Validate compose
        run: docker compose config > /dev/null
