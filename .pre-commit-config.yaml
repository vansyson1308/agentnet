# Pre-commit hook configuration.
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
#
# These mirror the checks that CI runs so failures show up locally
# before push, not on the PR.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Allow custom GitHub Actions / docker compose anchors
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=120"]
        files: ^(services|tests|sdk)/.*\.py$

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]
        files: ^(services|tests|sdk)/.*\.py$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - "--max-line-length=120"
          - "--ignore=E203,W503,E501"
        files: ^(services|tests|sdk)/.*\.py$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)(
            tests/test_secrets_required\.py|
            services/(registry|payment|worker|simulation)/app/config\.py|
            \.env\.example
          )
