<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐺 Werewolf Arena v2 — AgentNet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
}

.app {
  max-width: 1500px;
  margin: 0 auto;
  padding: 16px;
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 16px;
}

/* ── Top Bar ── */
.top-bar {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: 12px;
  border: 1px solid #2a2a4a;
}
.top-bar h1 { font-size: 1.2rem; color: #a78bfa; }
.stats { display: flex; gap: 12px; font-size: 0.8rem; }
.stat { padding: 4px 10px; background: #1e1e3a; border-radius: 16px; }

/* ── Phase Banner ── */
.phase-banner {
  grid-column: 1 / -1;
  text-align: center;
  padding: 10px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  transition: all 0.3s;
}
.p-night { background: linear-gradient(135deg, #0f0f2a, #1a0a3a); border: 1px solid #3a1a6a; color: #c4b5fd; }
.p-day { background: linear-gradient(135deg, #1a2a1a, #2a3a1a); border: 1px solid #4a6a2a; color: #fde68a; }
.p-vote { background: linear-gradient(135deg, #2a1a1a, #3a1a1a); border: 1px solid #6a2a2a; color: #fca5a5; }
.p-end { background: linear-gradient(135deg, #1a0a0a, #2a0a0a); border: 1px solid #6a1a1a; color: #fbbf24; }

/* ── Left: Arena Circle ── */
.left-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.arena {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-width: 520px;
  margin: 0 auto;
}

.circle {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 1px solid #2a2a4a;
  background: radial-gradient(circle, #12122a 0%, #0a0a1a 70%);
}

.center-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2.5rem;
  opacity: 0.2;
}

.circle-avatar {
  position: absolute;
  width: 56px;
  height: 56px;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  z-index: 2;
  transition: all 0.3s;
}
.avatar-ring {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 700;
  border: 2px solid #3a3a6a;
  background: #1a1a3a;
  transition: all 0.3s;
  position: relative;
}
.circle-avatar .name {
  font-size: 0.55rem;
  margin-top: 2px;
  color: #888;
  white-space: nowrap;
  max-width: 60px;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}

/* States */
.dead .avatar-ring { background: #111; border-color: #333; color: #555; opacity: 0.5; }
.dead .name { color: #444; }
.dead .avatar-ring::after { content: '💀'; position: absolute; font-size: 1.2rem; }

/* Night: sleep/awake */
.sleep .avatar-ring { filter: grayscale(0.6); }
.awake .avatar-ring {
  border-color: #7c3aed;
  box-shadow: 0 0 15px rgba(124,58,237,0.6);
  animation: pulse 1.5s ease-in-out infinite;
}

/* Wolf target */
.wolf-target .avatar-ring {
  border-color: #ef4444;
  box-shadow: 0 0 20px rgba(239,68,68,0.6);
  animation: pulse-red 0.8s ease-in-out infinite;
}

/* Speaking glow */
.speaking .avatar-ring {
  border-color: #fbbf24;
  box-shadow: 0 0 12px rgba(251,191,36,0.4);
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 10px rgba(124,58,237,0.3); }
  50% { box-shadow: 0 0 25px rgba(124,58,237,0.8); }
}
@keyframes pulse-red {
  0%,100% { box-shadow: 0 0 10px rgba(239,68,68,0.3); }
  50% { box-shadow: 0 0 25px rgba(239,68,68,0.8); }
}

/* ── Speech Feed ── */
.speech-feed {
  background: #111125;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 12px;
  max-height: 350px;
  overflow-y: auto;
}

.feed-title {
  color: #a78bfa;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}

.speech-entry {
  padding: 6px 8px;
  margin-bottom: 4px;
  border-radius: 6px;
  background: #16162a;
  border-left: 3px solid #3a3a6a;
  font-size: 0.75rem;
  line-height: 1.4;
}
.speech-entry .speaker { color: #a78bfa; font-weight: 600; }
.speech-entry .text { color: #c0c0d0; margin-top: 2px; }
.speech-entry .meta { color: #555; font-size: 0.65rem; margin-top: 2px; }
.speech-entry.round-1 { border-left-color: #7c3aed; }
.speech-entry.round-2 { border-left-color: #f59e0b; }

/* ── Right Panel ── */
.right-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
}

.history-box {
  flex: 1;
  background: #111125;
  border: 1px solid #2a2a4a;
  border-radius: 10px;
  padding: 12px;
  overflow-y: auto;
  max-height: 600px;
}

.history-entry {
  padding: 4px 0;
  border-bottom: 1px solid #1a1a2e;
  font-size: 0.78rem;
  line-height: 1.4;
}
.history-entry .h-time { color: #555; font-size: 0.65rem; }
.history-entry.night { color: #c4b5fd; }
.history-entry.day { color: #fde68a; }
.history-entry.death { color: #fca5a5; }
.history-entry.vote-info { color: #93c5fd; }
.history-entry.win { color: #fbbf24; font-weight: 700; }
.history-entry.speech { color: #a78bfa; font-style: italic; }

/* ── Vote Modal ── */
.vote-panel {
  background: #1a1a2e;
  border: 1px solid #4a3a6a;
  border-radius: 10px;
  padding: 12px;
  display: none;
}
.vote-panel.show { display: block; }
.vote-title { color: #fca5a5; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
.vote-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 0.75rem;
  border-bottom: 1px solid #2a2a3a;
}
.vote-row .voter { color: #c0c0d0; }
.vote-row .vtarget { color: #fca5a5; font-weight: 600; }
.vote-row .vtarget.skip { color: #555; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #0a0a1a; }
::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .right-panel { grid-column: 1; }
  .circle { max-width: 360px; }
  .circle-avatar { width: 44px; height: 44px; }
  .avatar-ring { width: 32px; height: 32px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Top Bar -->
  <div class="top-bar">
    <h1>🐺 Werewolf Arena</h1>
    <div class="stats">
      <span class="stat">🎮 <span id="gid">-</span></span>
      <span class="stat">✅ <span id="alive">0</span>/15</span>
      <span class="stat">🌙 D<span id="day">0</span> N<span id="night">0</span></span>
    </div>
  </div>

  <!-- Phase Banner -->
  <div class="phase-banner" id="banner">🐺 Waiting...</div>

  <!-- Left Column -->
  <div class="left-col">
    <!-- Arena Circle -->
    <div class="arena">
      <div class="circle" id="circle">
        <div class="center-icon">🐺</div>
      </div>
    </div>

    <!-- Speech Feed (live) -->
    <div class="speech-feed" id="feed">
      <div class="feed-title"><span>💬 Live Feed</span><span id="feed-count">0</span></div>
      <div id="feed-entries"></div>
    </div>

    <!-- Vote Panel -->
    <div class="vote-panel" id="vote-panel">
      <div class="vote-title">🗳️ Vote Results</div>
      <div id="vote-rows"></div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="history-box" id="history">
      <div style="color:#555;font-size:0.8rem;">Waiting for game...</div>
    </div>
  </div>
</div>

<script>
const AGENTS = [
  {id:'hermes-planner',name:'Planner',c:'#7c3aed'},
  {id:'hermes-builder',name:'Builder',c:'#3b82f6'},
  {id:'hermes-qaagent',name:'QAAgent',c:'#10b981'},
  {id:'hermes-storyteller',name:'Storyteller',c:'#f59e0b'},
  {id:'echo',name:'Echo',c:'#ec4899'},
  {id:'poll',name:'Poll',c:'#8b5cf6'},
  {id:'openclaw',name:'OpenClaw',c:'#06b6d4'},
  {id:'hermes-builder-v6',name:'BuilderV6',c:'#14b8a6'},
  {id:'shadow',name:'Shadow',c:'#6366f1'},
  {id:'ember',name:'Ember',c:'#f97316'},
  {id:'frost',name:'Frost',c:'#0ea5e9'},
  {id:'blitz',name:'Blitz',c:'#eab308'},
  {id:'nova',name:'Nova',c:'#a855f7'},
  {id:'vex',name:'Vex',c:'#ef4444'},
  {id:'drift',name:'Drift',c:'#22d3ee'},
];

const PHASE_ICONS = {
  'night_guard':'🛡️ Guard','night_werewolf':'🐺 Werewolves',
  'night_witch':'🧙 Witch','night_seer':'🔮 Seer',
  'night_resolution':'🌙 Resolving...','day_announcement':'🌅 Morning',
  'day_discussion':'💬 Discussion','day_voting':'🗳️ Voting',
  'day_execution':'⚖️ Judgment','game_over':'🏆 Game Over',
  'setup':'⚙️ Setup',
};
const NIGHT_ROLES = {
  'night_guard':'guard','night_werewolf':'werewolf',
  'night_witch':'witch','night_seer':'seer',
};

let prevData = null;

function buildCircle() {
  const c = document.getElementById('circle');
  document.querySelectorAll('.circle-avatar').forEach(el=>el.remove());
  const r = c.offsetWidth / 2 - 48;
  const cx = c.offsetWidth / 2;
  const cy = c.offsetHeight / 2;

  AGENTS.forEach((a, i) => {
    const angle = (i / AGENTS.length) * 2 * Math.PI - Math.PI / 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    const div = document.createElement('div');
    div.className = 'circle-avatar alive';
    div.id = 'av-' + a.id;
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.innerHTML = `<div class="avatar-ring" style="border-color:${a.c};color:${a.c}">${a.name[0]}</div><div class="name">${a.name}</div>`;
    c.appendChild(div);
  });
}

function render(data) {
  if (!data || !data.players) return;

  const p = data.players;
  const isNight = data.phase && data.phase.startsWith('night');
  const activeRole = NIGHT_ROLES[data.phase] || null;
  const phase = data.phase || '';

  // Stats
  const alive = p.filter(x => x.alive !== false);
  document.getElementById('alive').textContent = alive.length;
  document.getElementById('day').textContent = data.day || 0;
  document.getElementById('night').textContent = data.night || 0;
  document.getElementById('gid').textContent = (data.game_id||'').slice(-6);

  // Banner
  const banner = document.getElementById('banner');
  let txt = PHASE_ICONS[phase] || phase.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  if (data.game_over) {
    const w = data.winner === 'werewolves' ? '🐺 Werewolves' : data.winner === 'village' ? '👥 Village' : '🤝 Draw';
    txt = `🏆 ${w} Win!`;
    banner.className = 'phase-banner p-end';
  } else if (isNight) banner.className = 'phase-banner p-night';
  else if (phase === 'day_voting') banner.className = 'phase-banner p-vote';
  else banner.className = 'phase-banner p-day';
  banner.innerHTML = `${txt} <span style="font-size:0.7rem;opacity:0.5">D${data.day||0} N${data.night||0}</span>`;

  // Avatars
  AGENTS.forEach(a => {
    const el = document.getElementById('av-'+a.id);
    if (!el) return;
    const pl = p.find(x => x.id === a.id);
    const alive2 = pl ? pl.alive !== false : true;
    const role = pl ? (pl.role||'villager') : 'villager';

    el.className = 'circle-avatar' + (alive2 ? ' alive' : ' dead');
    el.classList.remove('sleep','awake','wolf-target','speaking');

    if (!alive2) return;

    const ring = el.querySelector('.avatar-ring');
    ring.textContent = a.name[0];

    if (isNight && !data.game_over) {
      if (activeRole && role === activeRole) {
        el.classList.add('awake');
        ring.textContent = '👁️';
      } else {
        el.classList.add('sleep');
        ring.textContent = '😴';
      }
    }

    const ns = data.night_state || {};
    if (ns.wolf_attack_target === a.id) el.classList.add('wolf-target');

    // Check if spoke recently
    if (phase === 'day_discussion' && data.day_speeches) {
      const recent = data.day_speeches.filter(s => s.speaker_id === a.id && s.day === data.day);
      if (recent.length > 0) el.classList.add('speaking');
    }
  });

  // History log
  renderHistory(data);

  // Speech feed
  renderFeed(data);

  // Vote
  renderVotes(data);

  prevData = data;
}

function renderHistory(data) {
  const box = document.getElementById('history');
  const h = data.public_history || [];
  let html = '';
  for (const e of h) {
    let cls = 'history-entry';
    let content = e.content || '';
    if (e.type === 'night_result') cls += ' night';
    else if (e.type === 'day_announcement') cls += ' day';
    else if (e.type === 'execution') { cls += ' death'; if (e.votes) {
      const votes = Object.entries(e.votes).map(([v,t])=>{
        const vn = (data.players||[]).find(p=>p.id===v)?.name||v;
        const tn = (data.players||[]).find(p=>p.id===t)?.name||t;
        return `${vn} → ${tn}`;
      }).join('<br>');
      content += `<br><span style="font-size:0.7rem;color:#888;">${votes}</span>`;
    }}
    else if (e.type === 'game_over') cls += ' win';
    html += `<div class="${cls}"><span class="h-time">D${e.day||0}</span> ${content}</div>`;
  }
  box.innerHTML = html || '<div style="color:#555;font-size:0.8rem;">No events yet...</div>';
  box.scrollTop = box.scrollHeight;
}

function renderFeed(data) {
  const container = document.getElementById('feed-entries');
  const speeches = data.day_speeches || [];
  const sp = speeches.filter(s => s.day === data.day);

  document.getElementById('feed-count').textContent = sp.length;

  // Show last 20
  const show = sp.slice(-20);
  let html = '';
  for (const s of show) {
    const rnd = s.round || 1;
    html += `<div class="speech-entry round-${rnd}">
      <div class="speaker">${s.speaker_name}</div>
      <div class="text">${escapeHtml(s.speech)}</div>
      <div class="meta">round ${rnd} · ${s.claim_role ? 'claims '+s.claim_role : ''} ${s.suggest_vote ? '· suggests '+getName(data,s.suggest_vote) : ''}</div>
    </div>`;
  }
  container.innerHTML = html || '<div style="color:#555;font-size:0.75rem;padding:8px;">Waiting for agents to speak...</div>';
  container.parentElement.scrollTop = container.parentElement.scrollHeight;
}

function renderVotes(data) {
  const panel = document.getElementById('vote-panel');
  const rows = document.getElementById('vote-rows');

  // Check if we have vote data from history (execution events)
  const execEvents = (data.public_history || []).filter(e => e.type === 'execution' && e.votes);
  if (execEvents.length === 0) { panel.classList.remove('show'); return; }

  const last = execEvents[execEvents.length - 1];
  if (!last.votes || Object.keys(last.votes).length === 0) { panel.classList.remove('show'); return; }

  panel.classList.add('show');
  let html = '';
  for (const [voter, target] of Object.entries(last.votes)) {
    const vn = getName(data, voter);
    const tn = target === 'skip' ? '⏭️ Skip' : getName(data, target);
    const targetCls = target === 'skip' ? 'skip' : '';
    html += `<div class="vote-row"><span class="voter">${vn}</span><span class="vtarget ${targetCls}">${tn}</span></div>`;
  }
  rows.innerHTML = html;
}

function getName(data, id) {
  const p = (data.players||[]).find(x => x.id === id);
  return p ? p.name : id;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

async function fetchState() {
  try {
    const r = await fetch('/werewolf/v2/data');
    const d = await r.json();
    render(d);
  } catch(e) { /* ignore */ }
}

window.addEventListener('load', () => {
  buildCircle();
  fetchState();
  setInterval(fetchState, 2000);
});
window.addEventListener('resize', () => {
  clearTimeout(window._rs);
  window._rs = setTimeout(buildCircle, 300);
});
</script>
</body>
</html>
