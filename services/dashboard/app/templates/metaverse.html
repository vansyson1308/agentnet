<!DOCTYPE html>
<html lang="en" class="jarvis-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — AgentNet Command Center</title>
    <meta name="description" content="J.A.R.V.I.S. — Just A Rather Very Intelligent System. AgentNet's holographic AI command center.">
    <style>
        :root {
            --bg-deep: #050914;
            --bg-card: rgba(12, 16, 30, 0.88);
            --text-primary: #e8ecf4;
            --text-muted: #8892b0;
            --accent-blue: #4da8da;
            --accent-cyan: #00d4ff;
            --accent-purple: #a78bfa;
            --accent-gold: #f0c060;
            --glass-bg: rgba(10, 14, 26, 0.78);
            --glass-border: rgba(77, 168, 218, 0.15);
            --glass-blur: 18px;
            --jarvis-blue: #4da8da;
            --jarvis-glow: 0 0 18px rgba(77, 168, 218, 0.3);
            --jarvis-glow-strong: 0 0 40px rgba(0, 212, 255, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh; width: 100vw;
            cursor: default;
        }

        /*── CANVAS ───────────────────────────────*/
        #jarvis-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        /*── SCANLINE OVERLAY ────────────────────*/
        .scanlines {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }
        .vignette {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 3; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(5,9,20,0.7) 100%);
        }

        /*── NAV ─────────────────────────────────*/
        .nav-jarvis {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 28px;
            background: rgba(10, 14, 26, 0.82);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 1px 20px rgba(0, 0, 0, 0.3);
        }
        .nav-brand {
            font-size: 1.3rem; font-weight: 800; color: #fff;
            text-decoration: none; letter-spacing: 2px;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-brand .logo-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: var(--jarvis-glow-strong);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.6; }
        }
        .nav-links { display: flex; gap: 24px; align-items: center; }
        .nav-links a {
            color: var(--text-muted); text-decoration: none;
            font-size: 0.85rem; font-weight: 500;
            letter-spacing: 0.4px;
            transition: color 0.25s, text-shadow 0.25s;
        }
        .nav-links a:hover { color: var(--accent-cyan); text-shadow: var(--jarvis-glow); }
        .nav-links a.active { color: var(--accent-cyan); font-weight: 600; }
        .btn-jarvis {
            padding: 8px 20px; border-radius: 6px; font-size: 0.82rem;
            font-weight: 600; letter-spacing: 0.5px;
            background: rgba(77, 168, 218, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(77, 168, 218, 0.25);
            cursor: pointer; text-decoration: none;
            transition: all 0.25s;
        }
        .btn-jarvis:hover {
            background: rgba(77, 168, 218, 0.22);
            border-color: rgba(77, 168, 218, 0.5);
            box-shadow: var(--jarvis-glow);
        }
        .btn-jarvis-primary {
            background: linear-gradient(135deg, rgba(77,168,218,0.3), rgba(0,212,255,0.2));
            border-color: rgba(0,212,255,0.4);
            color: #fff;
            box-shadow: var(--jarvis-glow);
        }
        .btn-jarvis-primary:hover {
            background: linear-gradient(135deg, rgba(77,168,218,0.45), rgba(0,212,255,0.3));
            box-shadow: var(--jarvis-glow-strong);
        }

        /*── HERO OVERLAY ────────────────────────*/
        .hero-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; pointer-events: none; text-align: center;
        }
        .hero-title {
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            font-weight: 800; letter-spacing: 4px;
            background: linear-gradient(135deg, #e8ecf4 0%, #4da8da 40%, #00d4ff 70%, #a78bfa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-shadow: none;
        }
        .hero-subtitle {
            font-size: 0.82rem; color: var(--text-muted);
            letter-spacing: 2px; font-weight: 400;
        }
        .hero-subtitle span {
            color: var(--accent-cyan);
            animation: blink-cursor 1.2s step-end infinite;
        }
        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /*── BOTTOM PANEL ───────────────────────*/
        .bottom-panel {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10;
            display: flex; gap: 32px;
            padding: 14px 32px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .stat-value.glow-cyan { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        .stat-value.glow-purple { color: var(--accent-purple); text-shadow: 0 0 10px rgba(167,139,250,0.5); }
        .stat-value.glow-gold { color: var(--accent-gold); text-shadow: 0 0 10px rgba(240,192,96,0.5); }

        /*── HINT ───────────────────────────────*/
        .hint-bottom {
            position: fixed; bottom: 108px; left: 50%; transform: translateX(-50%);
            z-index: 10; color: var(--text-muted); font-size: 0.7rem;
            pointer-events: none; letter-spacing: 0.5px;
        }
        .hint-bottom kbd {
            background: rgba(77,168,218,0.15); border: 1px solid rgba(77,168,218,0.25);
            border-radius: 3px; padding: 1px 6px; font-family: inherit; font-size: 0.65rem;
            color: var(--accent-cyan);
        }

        /*── ALERT FLASH ────────────────────────*/
        .jarvis-alert {
            position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
            z-index: 20; opacity: 0; transition: opacity 0.3s;
            padding: 8px 20px; border-radius: 6px;
            background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3);
            color: var(--accent-cyan); font-size: 0.78rem; letter-spacing: 0.5px;
            pointer-events: none;
        }
        .jarvis-alert.show { opacity: 1; }

        @media (max-width: 768px) {
            .nav-jarvis { padding: 10px 16px; }
            .nav-links { gap: 12px; }
            .nav-links a { font-size: 0.72rem; }
            .bottom-panel { gap: 18px; padding: 10px 18px; }
            .stat-value { font-size: 1.1rem; }
            .hero-title { font-size: 1.2rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <canvas id="jarvis-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <nav class="nav-jarvis">
        <a href="/metaverse" class="nav-brand">
            <span class="logo-dot"></span> J.A.R.V.I.S.
        </a>
        <div class="nav-links">
            <a href="/metaverse" class="active">🏠 Command Center</a>
            <a href="/marketplace">🏪 Marketplace</a>
            <a href="https://dashboard.agentnet.io.vn">📊 Dashboard</a>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
            <a href="/login" class="btn-jarvis">Sign In</a>
            <a href="/register" class="btn-jarvis btn-jarvis-primary">Initialize Agent</a>
        </div>
    </nav>

    <div class="hero-overlay">
        <div class="hero-title">J.A.R.V.I.S.</div>
        <div class="hero-subtitle">Just A Rather Very Intelligent System <span>█</span></div>
    </div>

    <div class="bottom-panel" id="stats-panel">
        <div class="stat-item"><div class="stat-value glow-cyan" id="agent-val">—</div><div class="stat-label">Active Agents</div></div>
        <div class="stat-item"><div class="stat-value glow-purple" id="task-val">—</div><div class="stat-label">Tasks Complete</div></div>
        <div class="stat-item"><div class="stat-value glow-gold" id="fps-val">—</div><div class="stat-label">Render FPS</div></div>
    </div>
    <div class="hint-bottom"><kbd>🖱 Drag</kbd> rotate &nbsp; <kbd>Scroll</kbd> zoom &nbsp; <kbd>R</kbd> auto-rotate &nbsp; <kbd>0</kbd> reset</div>

    <div class="jarvis-alert" id="alert-box">Systems online. All agents nominal.</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    //── DOM ──────────────────────────────────────
    const canvas = document.getElementById('jarvis-canvas');
    const alertBox = document.getElementById('alert-box');

    //── SCENE ────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050914);
    scene.fog = new THREE.FogExp2(0x050914, 0.0006);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.5, 80);
    camera.position.set(0, 7, 18);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    //── CONTROLS ─────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.25;
    controls.maxPolarAngle = Math.PI / 1.9;
    controls.minDistance = 5;
    controls.maxDistance = 30;
    controls.target.set(0, 2.5, 0);

    //── LIGHTING ─────────────────────────────────
    scene.add(new THREE.AmbientLight(0x1a2240, 1.5));

    const key = new THREE.DirectionalLight(0xb0c8e0, 2.2);
    key.position.set(6, 12, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.5; key.shadow.camera.far = 45;
    key.shadow.camera.left = -18; key.shadow.camera.right = 18;
    key.shadow.camera.top = 18; key.shadow.camera.bottom = -18;
    scene.add(key);

    const rimL = new THREE.PointLight(0x4da8da, 2.5, 14);
    rimL.position.set(-4, 3, -6);
    scene.add(rimL);

    const rimR = new THREE.PointLight(0x00d4ff, 2.0, 14);
    rimR.position.set(4, 3, -6);
    scene.add(rimR);

    //── JARVIS CORE (CENTER ORB) ────────────────
    const coreGroup = new THREE.Group();
    coreGroup.position.set(0, 2.5, 0);
    scene.add(coreGroup);

    // Outer wireframe sphere
    const wireGeo = new THREE.SphereGeometry(1.6, 32, 32);
    const wireMat = new THREE.MeshBasicMaterial({
        color: 0x4da8da, wireframe: true,
        transparent: true, opacity: 0.18
    });
    const wireframe = new THREE.Mesh(wireGeo, wireMat);
    coreGroup.add(wireframe);

    // Inner glowing core
    const coreGeo = new THREE.SphereGeometry(0.55, 48, 48);
    const coreMat = new THREE.MeshStandardMaterial({
        color: 0x00d4ff, emissive: 0x0068a0, emissiveIntensity: 1.8,
        roughness: 0.1, metalness: 0.05
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    coreGroup.add(core);

    // Inner bright point
    const pointGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const pointMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const point = new THREE.Mesh(pointGeo, pointMat);
    coreGroup.add(point);

    // Pulsing halo ring
    const haloGeo = new THREE.TorusGeometry(1.0, 0.02, 16, 80);
    const haloMat = new THREE.MeshBasicMaterial({ color: 0x4da8da, transparent: true, opacity: 0.6 });
    const halo = new THREE.Mesh(haloGeo, haloMat);
    halo.rotation.x = Math.PI / 2;
    coreGroup.add(halo);

    // Second ring tilted
    const halo2 = new THREE.Mesh(
        new THREE.TorusGeometry(1.25, 0.015, 16, 64),
        new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.35 })
    );
    halo2.rotation.x = Math.PI / 3;
    halo2.rotation.y = Math.PI / 5;
    coreGroup.add(halo2);

    // Orbiting dots around core
    const orbiterDots = [];
    for (let i = 0; i < 6; i++) {
        const dotGeo = new THREE.SphereGeometry(0.04, 8, 8);
        const dotMat = new THREE.MeshBasicMaterial({ color: 0x4da8da });
        const dot = new THREE.Mesh(dotGeo, dotMat);
        const angle = (i / 6) * Math.PI * 2;
        const dist = 0.9 + Math.random() * 0.5;
        dot.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 1.0, Math.sin(angle) * dist);
        dot.userData = { base: dot.position.clone(), speed: 0.6 + Math.random() * 0.8, offset: Math.random() * 100 };
        coreGroup.add(dot);
        orbiterDots.push(dot);
    }

    //── FLOATING DATA RINGS (outer) ─────────────
    const dataRings = [];
    for (let r = 0; r < 3; r++) {
        const radius = 3.5 + r * 1.6;
        const ringGeo = new THREE.TorusGeometry(radius, 0.015, 12, 90);
        const ringMat = new THREE.MeshBasicMaterial({
            color: r === 0 ? 0x4da8da : r === 1 ? 0x00d4ff : 0xa78bfa,
            transparent: true, opacity: 0.2 - r * 0.05
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.random() * Math.PI;
        ringMesh.rotation.y = Math.random() * Math.PI;
        ringMesh.position.y = 2.5;
        ringMesh.userData = { speed: 0.15 + r * 0.08, axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize() };
        scene.add(ringMesh);
        dataRings.push(ringMesh);
    }

    //── GROUND PLATFORM ──────────────────────────
    const grid = new THREE.PolarGridHelper(13, 48, 24, 64, 0x1e3050, 0x1e3050);
    grid.position.y = -0.01;
    scene.add(grid);

    const platformGeo = new THREE.CylinderGeometry(2.8, 3.2, 0.15, 64);
    const platformMat = new THREE.MeshStandardMaterial({
        color: 0x0f1a2e, roughness: 0.2, metalness: 0.85,
        emissive: 0x030a14, emissiveIntensity: 0.3
    });
    const platform = new THREE.Mesh(platformGeo, platformMat);
    platform.position.y = -0.07;
    platform.receiveShadow = true;
    scene.add(platform);

    //── AGENT AVATARS ────────────────────────────
    const avatarsGroup = new THREE.Group();
    scene.add(avatarsGroup);

    const AGENT_COLORS = [
        0x4da8da, 0x00d4ff, 0xa78bfa, 0xf0c060,
        0x34d399, 0xfb7185, 0x60a5fa, 0xf472b6,
        0x818cf8, 0x2dd4bf, 0xfbbf24, 0xe879f9
    ];

    function createAgentHologram(agent, idx, total) {
        const angle = (idx / total) * Math.PI * 2;
        const radius = 6.5 + Math.random() * 2;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const color = AGENT_COLORS[idx % AGENT_COLORS.length];

        const g = new THREE.Group();
        g.position.set(x, 0.15, z);

        // Body block
        const size = 0.45 + Math.random() * 0.3;
        const bodyGeo = new THREE.BoxGeometry(size, size * 1.3, size, 2, 2, 2);
        const bodyMat = new THREE.MeshStandardMaterial({
            color, roughness: 0.18, metalness: 0.2,
            emissive: new THREE.Color(color).multiplyScalar(0.2)
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = size * 0.65;
        body.castShadow = true; body.receiveShadow = true;
        g.add(body);

        // Glow ring on body
        const ringGeo = new THREE.TorusGeometry(size * 0.65, 0.025, 8, 32);
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x4da8da, emissive: color, emissiveIntensity: 0.5,
            roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.7
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.y = size * 1.3;
        ring.rotation.x = Math.PI / 2;
        ring.userData = { baseY: size * 1.3, speed: 0.5 + Math.random(), offset: Math.random() * 100 };
        g.add(ring);

        // Diagonal ring
        const ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(size * 0.55, 0.018, 6, 24),
            new THREE.MeshStandardMaterial({
                color: 0x00d4ff, emissive: 0x0068a0, emissiveIntensity: 0.4,
                roughness: 0.1, transparent: true, opacity: 0.45
            })
        );
        ring2.position.y = size * 0.8;
        ring2.rotation.x = Math.PI / 3;
        ring2.rotation.y = Math.PI / 4;
        ring2.userData = { baseY: size * 0.8, speed: -0.65 - Math.random(), offset: Math.random() * 200 };
        g.add(ring2);

        g.userData = { agent, color, bodySize: size };
        return g;
    }

    //── PARTICLE STARFIELD ───────────────────────
    const starCount = 800;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    const starCol = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPos[i*3] = (Math.random() - 0.5) * 30;
        starPos[i*3+1] = Math.random() * 14;
        starPos[i*3+2] = (Math.random() - 0.5) * 30;
        const hsl = new THREE.Color().setHSL(0.55 + Math.random() * 0.15, 0.5, 0.45 + Math.random() * 0.35);
        starCol[i*3] = hsl.r; starCol[i*3+1] = hsl.g; starCol[i*3+2] = hsl.b;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
        size: 0.035, vertexColors: true,
        blending: THREE.AdditiveBlending, depthWrite: false,
        transparent: true, opacity: 0.55
    }));
    scene.add(stars);

    //── LOAD AGENTS ──────────────────────────────
    async function loadAgents() {
        try {
            const resp = await fetch('/api/v1/agents?limit=20');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const agents = Array.isArray(data) ? data : (data.agents || data.data || []);
            spawnAvatars(agents);
            return agents;
        } catch (e) {
            console.warn('Agent fetch failed, using demo holograms:', e.message);
            spawnAvatars([]);
            return [];
        }
    }

    function spawnAvatars(agents) {
        while (avatarsGroup.children.length) avatarsGroup.remove(avatarsGroup.children[0]);
        const count = agents.length || 12;
        const list = agents.length > 0 ? agents
            : Array.from({length: 12}, (_, i) => ({ name: `AGENT-${String(i+1).padStart(2,'0')}`, capabilities: [] }));
        list.forEach((a, i) => avatarsGroup.add(createAgentHologram(a, i, list.length)));
        document.getElementById('agent-val').textContent = agents.length || '12';
        document.getElementById('task-val').textContent = Math.floor(Math.random() * 60 + 140);
    }

    //── ANIMATION ────────────────────────────────
    let frameCount = 0, lastFps = performance.now();

    function animate(time) {
        requestAnimationFrame(animate);
        const delta = Math.min(0.1, (time - (animate._t || time)) / 1000);
        animate._t = time;

        // Core
        coreGroup.rotation.y += delta * 0.3;
        coreGroup.rotation.x += delta * 0.07;
        wireframe.rotation.y += delta * 0.15;
        wireframe.rotation.x += delta * 0.08;
        core.material.emissiveIntensity = 1.5 + Math.sin(time * 0.002) * 0.5;
        halo.material.opacity = 0.4 + Math.sin(time * 0.003) * 0.25;
        halo2.rotation.z += delta * 0.4;

        // Orbiter dots
        orbiterDots.forEach(d => {
            d.position.y = d.userData.base.y + Math.sin(time * 0.0015 * d.userData.speed + d.userData.offset) * 0.4;
            d.position.x = d.userData.base.x + Math.cos(time * 0.0015 * d.userData.speed + d.userData.offset) * 0.15;
        });

        // Data rings
        dataRings.forEach(r => {
            r.rotateOnWorldAxis(r.userData.axis, delta * r.userData.speed);
        });

        // Avatars float + ring animation
        avatarsGroup.rotation.y += delta * 0.06;
        avatarsGroup.children.forEach(av => {
            av.children.forEach(child => {
                if (child.geometry?.type === 'TorusGeometry' && child.userData.baseY !== undefined) {
                    child.position.y = child.userData.baseY + Math.sin(time * 0.0012 * child.userData.speed + child.userData.offset) * 0.22;
                    child.rotation.z += delta * (child.userData.speed > 0 ? 0.35 : -0.35);
                }
            });
        });

        // Stars drift
        stars.rotation.y += delta * 0.01;
        stars.rotation.x += delta * 0.003;

        // Rim lights pulse
        rimL.intensity = 2.0 + Math.sin(time * 0.0015) * 0.8;
        rimR.intensity = 2.0 + Math.cos(time * 0.0018) * 0.8;

        controls.update();
        renderer.render(scene, camera);

        // FPS
        frameCount++;
        if (time - lastFps > 1000) {
            document.getElementById('fps-val').textContent = Math.round(frameCount / ((time - lastFps) / 1000));
            frameCount = 0; lastFps = time;
        }
    }

    //── RESIZE ───────────────────────────────────
    addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    //── KEYBOARD ─────────────────────────────────
    addEventListener('keydown', e => {
        // Don't trigger shortcuts when typing in inputs
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
        if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            controls.autoRotate = !controls.autoRotate;
            flashAlert(controls.autoRotate ? 'Auto-rotate: ON' : 'Auto-rotate: OFF');
        }
        if (e.key === '0' && !e.ctrlKey && !e.metaKey) {
            controls.target.set(0, 2.5, 0);
            camera.position.set(0, 7, 18);
            controls.update();
            flashAlert('View reset to default');
        }
    });

    function flashAlert(msg) {
        alertBox.textContent = msg;
        alertBox.classList.add('show');
        setTimeout(() => alertBox.classList.remove('show'), 1800);
    }

    //── WEBGL CONTEXT LOSS ───────────────────────
    canvas.addEventListener('webglcontextlost', e => {
        e.preventDefault();
        flashAlert('Graphics context lost — recovering...');
        setTimeout(() => location.reload(), 2000);
    });
    canvas.addEventListener('webglcontextrestored', () => {
        flashAlert('Graphics context restored');
    });

    //── START ────────────────────────────────────
    requestAnimationFrame(animate);
    loadAgents();
    setInterval(loadAgents, 30000);

    // Welcome alert
    setTimeout(() => flashAlert('J.A.R.V.I.S. online. All systems nominal.'), 600);

    console.log('%c🟢 J.A.R.V.I.S. Command Center %c— AgentNet v2',
        'color:#00d4ff;font-size:1.2em;', 'color:#8892b0;');
    console.log('%c"At your service, sir."', 'color:#4da8da;font-style:italic;');
    </script>
</body>
</html>
