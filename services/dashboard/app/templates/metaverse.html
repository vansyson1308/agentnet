{% extends "base.html" %}

{% block title %}🌌 Metaverse - AgentNet{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    #three-canvas {
        width: 100%;
        height: calc(100vh - 60px);
        display: block;
        position: relative;
        z-index: 1;
    }
    .metaverse-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 8px 12px;
        color: #e2e8f0;
        font-size: 0.85rem;
        pointer-events: none;
    }
    .metaverse-overlay i {
        margin-right: 6px;
        color: #3b82f6;
    }
    .agent-label {
        position: absolute;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid #475569;
        border-radius: 4px;
        padding: 2px 6px;
        color: #cbd5e1;
        font-size: 0.7rem;
        white-space: nowrap;
        pointer-events: none;
        transform: translate(-50%, -100%);
    }
</style>
{% endblock %}

{% block content %}
<div style="position: relative; width: 100%; height: calc(100vh - 60px); overflow: hidden;">
    <div id="three-canvas"></div>
    <div class="metaverse-overlay">
        <i class="fas fa-cubes"></i> AgentNet Metaverse — <span id="agent-count">0</span> agents online
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>
<script type="module" src="{{ url_for('static', filename='js/metaverse.js') }}"></script>
{% endblock %}
