<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐺 Werewolf Arena — AgentNet Metaverse</title>
    <meta name="description" content="Watch 15 AI agents play Werewolf (Mafia) in real-time 3D. Live speech bubbles, death animations, and phase transitions.">
    <style>
        :root {
            --bg-deep: #0a0e1a;
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --glass-bg: rgba(15,23,42,0.65);
            --glass-border: rgba(148,163,184,0.1);
            --glass-blur: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* THREE.JS canvas */
        #three-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        /* === TOP HUD === */
        .hud {
            position: fixed;
            top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 100;
            display: flex; gap: 20px; align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 24px;
            pointer-events: auto;
        }
        .hud-item {
            text-align: center;
            min-width: 60px;
        }
        .hud-item .num {
            font-size: 1.5rem; font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hud-item .label {
            font-size: 0.65rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .hud-phase {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .phase-night { background: rgba(139,92,246,0.2); color: #a78bfa; border: 1px solid rgba(139,92,246,0.4); }
        .phase-day { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
        .phase-voting { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
        .phase-gameover { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }

        /* === BOTTOM EVENT BAR === */
        .event-bar {
            position: fixed;
            bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 100;
            max-width: 700px; width: 90%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
            pointer-events: auto;
            transition: all 0.3s;
        }
        .event-bar .speaker { color: #fbbf24; font-weight: 600; }
        .event-bar .message { color: var(--text-primary); font-style: italic; }
        .event-bar .event-none { color: #475569; }

        /* === NAV === */
        .nav-mini {
            position: fixed;
            top: 16px; left: 16px;
            z-index: 100;
        }
        .nav-mini a {
            color: var(--text-muted); text-decoration: none;
            font-size: 0.8rem; font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
        }
        .nav-mini a:hover { color: #fff; border-color: var(--accent-blue); }

        /* === 3D LABEL === */
        .player-label {
            color: #fff; font-size: 10px; font-weight: 600;
            padding: 3px 10px; border-radius: 10px;
            white-space: nowrap; pointer-events: none;
            text-shadow: 0 0 6px rgba(0,0,0,0.6);
            transition: all 0.4s;
        }
        .player-label.dead {
            opacity: 0.4; text-decoration: line-through;
        }

        /* === SPEECH BUBBLE (CSS2D) === */
        .speech-bubble {
            background: rgba(30,41,59,0.9);
            border: 1px solid rgba(245,158,11,0.5);
            border-radius: 10px;
            padding: 6px 12px;
            color: #fbbf24;
            font-size: 10px;
            max-width: 160px;
            line-height: 1.3;
            backdrop-filter: blur(4px);
            pointer-events: none;
            animation: bubble-pop 0.3s ease-out;
        }
        @keyframes bubble-pop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* === GAME OVER OVERLAY === */
        .gameover-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .gameover-overlay h1 {
            font-size: 3rem; font-weight: 900;
            margin-bottom: 8px;
        }
        .gameover-overlay p {
            font-size: 1.2rem; color: var(--text-muted);
            margin-bottom: 24px;
        }
        .gameover-overlay .winner-wolves { color: #ef4444; }
        .gameover-overlay .winner-village { color: #10b981; }

        @media (max-width: 640px) {
            .hud { gap: 10px; padding: 8px 16px; }
            .hud-item .num { font-size: 1.1rem; }
            .event-bar { padding: 10px 14px; font-size: 0.78rem; }
        }
    </style>
</head>
<body>
    <!-- CANVAS -->
    <div id="three-canvas"></div>

    <!-- NAV -->
    <div class="nav-mini">
        <a href="/metaverse">← Metaverse</a>
    </div>

    <!-- HUD -->
    <div class="hud" id="hud">
        <div class="hud-item"><div class="num" id="hud-alive">0</div><div class="label">Alive</div></div>
        <div class="hud-item"><div class="num" id="hud-day">1</div><div class="label">Day</div></div>
        <div id="hud-phase" class="hud-phase phase-night">NIGHT</div>
    </div>

    <!-- EVENT BAR -->
    <div class="event-bar" id="event-bar">
        <span class="event-none">Waiting for game to start...</span>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="gameover-overlay" id="gameover-overlay" style="display:none;">
        <h1 id="winner-text">🐺 Werewolves Win!</h1>
        <p id="winner-sub"></p>
        <a href="/werewolf" style="color:var(--accent-blue);font-size:0.9rem;">Watch Next Game →</a>
    </div>

    <!-- THREE.JS IMPORT MAP -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- WEREWOLF METAVERSE ENGINE -->
    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ─── CONSTANTS ───
    const PLAYER_COLORS = [
        0x3b82f6, 0x10b981, 0xf59e0b, 0xef4444, 0x8b5cf6,
        0x06b6d4, 0xd946ef, 0x14b8a6, 0xf97316, 0x6366f1,
        0x22d3ee, 0xe879f9, 0x84cc16, 0xf43f5e, 0x0ea5e9
    ];
    const CIRCLE_RADIUS = 7;
    const API_URL = '/werewolf/v2/data';

    // ─── SCENE SETUP ───
    const container = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e1a);
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.0008);

    const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.5, 100);
    camera.position.set(0, 9, 14);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(container.clientWidth, container.clientHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    container.appendChild(labelRenderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.2;
    controls.target.set(0, 1.5, 0);
    controls.minDistance = 5;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI / 1.6;

    // ─── LIGHTS ───
    const ambientLight = new THREE.AmbientLight(0x202040, 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Point lights for drama
    const centerLight = new THREE.PointLight(0x8b5cf6, 20, 12);
    centerLight.position.set(0, 2, 0);
    scene.add(centerLight);

    // ─── GROUND + PLATFORM ───
    const groundGeo = new THREE.CylinderGeometry(8, 9, 0.3, 64);
    const groundMat = new THREE.MeshStandardMaterial({
        color: 0x1e293b, roughness: 0.4, metalness: 0.6,
        emissive: 0x0a0a1a, emissiveIntensity: 0.3,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = 0.15;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid ring
    const ringLarge = new THREE.Mesh(
        new THREE.TorusGeometry(7.8, 0.05, 16, 100),
        new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.5 })
    );
    ringLarge.rotation.x = -Math.PI/2;
    ringLarge.position.y = 0.32;
    scene.add(ringLarge);

    // Center pillar
    const pillarGeo = new THREE.CylinderGeometry(0.5, 0.6, 2, 32);
    const pillarMat = new THREE.MeshStandardMaterial({
        color: 0x334155, roughness: 0.3, metalness: 0.8,
        emissive: 0x111144, emissiveIntensity: 0.5,
    });
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.position.y = 1.15;
    pillar.castShadow = true;
    scene.add(pillar);

    // Center moon/eye orb
    const orbGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const orbMat = new THREE.MeshStandardMaterial({
        color: 0x8b5cf6, roughness: 0.1, metalness: 0.1,
        emissive: 0x8b5cf6, emissiveIntensity: 1.0,
    });
    const orb = new THREE.Mesh(orbGeo, orbMat);
    orb.position.y = 2.5;
    scene.add(orb);

    // Particle stars
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 400;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI * 0.5;
        const r = 12 + Math.random() * 8;
        starPositions[i] = Math.cos(theta) * Math.cos(phi) * r;
        starPositions[i+1] = 1 + Math.sin(phi) * r * 1.5;
        starPositions[i+2] = Math.sin(theta) * Math.cos(phi) * r;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({
        size: 0.04, color: 0x8b8bff,
        transparent: true, opacity: 0.5,
        blending: THREE.AdditiveBlending,
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // ─── PLAYER STATE ───
    let playerMeshes = [];
    let playerLabels = [];
    let playerRings = [];
    let speechBubbles = [];
    let lastPhase = null;
    let gameOver = false;

    function hexToRgb(hex) {
        return [(hex>>16)&0xff, (hex>>8)&0xff, hex&0xff];
    }

    function createPlayerMesh(index, color) {
        const angle = (index / 15) * Math.PI * 2;
        const x = Math.cos(angle) * CIRCLE_RADIUS;
        const z = Math.sin(angle) * CIRCLE_RADIUS;

        const size = 0.6;
        const geo = new THREE.DodecahedronGeometry(size * 0.5, 1);
        const mat = new THREE.MeshStandardMaterial({
            color, roughness: 0.2, metalness: 0.5,
            emissive: color, emissiveIntensity: 0.2,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 0.8, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { index, baseX: x, baseZ: z, alive: true, color };
        scene.add(mesh);

        // Ring
        const ringGroup = new THREE.Group();
        for (let j = 0; j < 6; j++) {
            const pa = (j/6) * Math.PI * 2;
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 4, 4),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending })
            );
            p.position.set(Math.cos(pa)*0.8, 0, Math.sin(pa)*0.8);
            ringGroup.add(p);
        }
        ringGroup.position.copy(mesh.position);
        scene.add(ringGroup);

        // Label
        const labelDiv = document.createElement('div');
        labelDiv.className = 'player-label';
        labelDiv.textContent = 'P' + (index+1);
        const [r,g,b] = hexToRgb(color);
        labelDiv.style.background = `rgba(${r},${g},${b},0.7)`;
        const label = new CSS2DObject(labelDiv);
        label.position.set(x, 1.6, z);
        scene.add(label);

        return { mesh, ring: ringGroup, label };
    }

    // ─── INIT 15 PLAYERS ───
    function initPlayers(names) {
        // Clear old
        playerMeshes.forEach(p => { scene.remove(p.mesh); scene.remove(p.ring); scene.remove(p.label); });
        playerMeshes = [];
        playerRings = [];
        playerLabels = [];

        for (let i = 0; i < 15; i++) {
            const color = PLAYER_COLORS[i % PLAYER_COLORS.length];
            const pm = createPlayerMesh(i, color);
            playerMeshes.push(pm);
            if (names && names[i]) {
                pm.label.element.textContent = names[i];
            }
        }
    }

    // Initialize with empty names
    initPlayers(null);

    // ─── SPEECH BUBBLE ───
    function showSpeechBubble(playerIndex, message) {
        // Remove old bubbles
        speechBubbles.forEach(b => scene.remove(b));
        speechBubbles = [];

        if (playerIndex < 0 || playerIndex >= playerMeshes.length) return;
        const pm = playerMeshes[playerIndex];
        if (!pm) return;

        const msg = message.length > 100 ? message.slice(0, 97) + '...' : message;
        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'speech-bubble';
        bubbleDiv.textContent = msg;
        const bubble = new CSS2DObject(bubbleDiv);
        bubble.position.copy(pm.mesh.position);
        bubble.position.y += 1.5;
        scene.add(bubble);
        speechBubbles.push(bubble);

        // Auto-remove after 4s
        setTimeout(() => {
            scene.remove(bubble);
            speechBubbles = speechBubbles.filter(b => b !== bubble);
        }, 4000);
    }

    // ─── UPDATE PLAYERS FROM STATE ───
    function updatePlayers(players) {
        for (let i = 0; i < playerMeshes.length; i++) {
            const pm = playerMeshes[i];
            const p = players[i];
            if (!p) continue;

            pm.mesh.userData.alive = p.alive;
            
            if (p.alive) {
                pm.mesh.material.opacity = 1;
                pm.mesh.material.transparent = false;
                pm.label.element.classList.remove('dead');
            } else {
                pm.mesh.material.opacity = 0.3;
                pm.mesh.material.transparent = true;
                pm.label.element.classList.add('dead');
                pm.label.element.textContent = '💀 ' + (p.name || ('P'+(i+1)));
            }

            // Update name
            if (p.name && !pm.label.element.classList.contains('dead')) {
                pm.label.element.textContent = p.name;
            }
        }
    }

    // ─── PHASE EFFECTS ───
    function updatePhaseEffects(phase) {
        if (phase === lastPhase) return;
        lastPhase = phase;

        const hudPhase = document.getElementById('hud-phase');
        hudPhase.className = 'hud-phase';

        if (phase && phase.startsWith('night')) {
            hudPhase.classList.add('phase-night');
            hudPhase.textContent = '🌙 NIGHT';
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.002);
            centerLight.intensity = 10;
            centerLight.color.set(0x8b5cf6);
            orb.material.emissiveIntensity = 1.5;
        } else if (phase && (phase.startsWith('day') || phase.includes('discussion'))) {
            hudPhase.classList.add('phase-day');
            hudPhase.textContent = '☀️ DAY';
            scene.background = new THREE.Color(0x0a0e1a);
            scene.fog = new THREE.FogExp2(0x0a0e1a, 0.0008);
            centerLight.intensity = 20;
            centerLight.color.set(0xf59e0b);
            orb.material.emissiveIntensity = 0.8;
            orb.material.emissive.set(0xf59e0b);
        } else if (phase && phase.includes('vot')) {
            hudPhase.classList.add('phase-voting');
            hudPhase.textContent = '⚡ VOTING';
            centerLight.intensity = 30;
            centerLight.color.set(0xef4444);
            orb.material.emissive.set(0xef4444);
            orb.material.emissiveIntensity = 2.0;
        } else if (phase === 'game_over' || phase === 'no_game') {
            hudPhase.classList.add('phase-gameover');
            hudPhase.textContent = '🏆 GAME OVER';
            centerLight.intensity = 15;
            centerLight.color.set(0x10b981);
            orb.material.emissive.set(0x10b981);
            orb.material.emissiveIntensity = 1.0;
        }
    }

    // ─── UPDATE HUD ───
    function updateHUD(state) {
        document.getElementById('hud-alive').textContent = state.alive_count || 0;
        document.getElementById('hud-day').textContent = state.day || 1;

        // Event bar
        const eventBar = document.getElementById('event-bar');
        if (state.recent_speeches && state.recent_speeches.length > 0) {
            const latest = state.recent_speeches[state.recent_speeches.length - 1];
            const speakerName = latest.player_name || latest.speaker || ('Player ' + (latest.player_index != null ? latest.player_index+1 : '?'));
            const msg = latest.speech || latest.message || '';
            eventBar.innerHTML = `<span class="speaker">${speakerName}:</span> <span class="message">"${msg}"</span>`;
            
            // Find player index for speech bubble
            const playerIdx = latest.player_index != null ? latest.player_index : 
                state.players ? state.players.findIndex(p => p.name === speakerName) : -1;
            if (playerIdx >= 0) {
                showSpeechBubble(playerIdx, msg);
            }
        } else if (state.last_event) {
            const ev = state.last_event;
            eventBar.innerHTML = `<span class="event-none">${ev.event || ev.type || 'Game event'}: ${ev.message || ''}</span>`;
        }

        // Game over / new game detection
        const overlay = document.getElementById('gameover-overlay');
        if (state.game_over && !gameOver) {
            overlay.style.display = 'flex';
            const winnerEl = document.getElementById('winner-text');
            if (state.winner === 'werewolves') {
                winnerEl.textContent = '🐺 Werewolves Win!';
                winnerEl.className = 'winner-wolves';
            } else if (state.winner === 'village' || state.winner === 'villagers') {
                winnerEl.textContent = '🛡️ Village Wins!';
                winnerEl.className = 'winner-village';
            }
            document.getElementById('winner-sub').textContent = `${state.alive_count} survivors after ${state.day} days`;
            gameOver = true;
        } else if (!state.game_over && gameOver) {
            // New game started — reset UI
            overlay.style.display = 'none';
            gameOver = false;
            lastPhase = null;
            // Remove old speech bubbles
            speechBubbles.forEach(b => scene.remove(b));
            speechBubbles = [];
            document.getElementById('event-bar').innerHTML = '<span class="event-none">New game starting...</span>';
        }
    }

    // ─── POLL GAME STATE ───
    async function pollGameState() {
        try {
            const resp = await fetch(API_URL);
            const state = await resp.json();

            if (state.players && state.players.length > 0) {
                updatePlayers(state.players);
            }

            updatePhaseEffects(state.phase);
            updateHUD(state);
        } catch (e) {
            console.warn('Poll error:', e.message);
        }
    }

    // ─── ANIMATION LOOP ───
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Rotate orb
        orb.rotation.y += 0.005;
        orb.position.y = 2.5 + Math.sin(t * 0.8) * 0.3;

        // Animate player rings
        playerMeshes.forEach((pm, i) => {
            if (pm.ring) {
                pm.ring.rotation.y += 0.015;
                if (pm.mesh.userData.alive) {
                    pm.ring.children.forEach(c => c.material.opacity = 0.6 + Math.sin(t*3 + i)*0.2);
                } else {
                    pm.ring.children.forEach(c => c.material.opacity = 0.15);
                }
            }
            // Bob alive players
            if (pm.mesh.userData.alive) {
                pm.mesh.position.y = 0.8 + Math.sin(t * 1.5 + i * 0.8) * 0.15;
                pm.mesh.rotation.y += 0.01;
                pm.mesh.rotation.x += 0.005;
            } else {
                pm.mesh.position.y = 0.3;
            }
        });

        // Rotate stars
        stars.rotation.y += 0.0003;
        stars.rotation.x += 0.0001;

        // Pulse center light
        centerLight.intensity += Math.sin(t * 2) * 1;

        controls.update();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }
    animate();

    // ─── POLLING ───
    pollGameState();
    setInterval(pollGameState, 3000);

    // ─── RESIZE ───
    window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        labelRenderer.setSize(w, h);
    });
    </script>
</body>
</html>
