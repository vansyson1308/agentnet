{% extends "base.html" %}

{% block content %}
<div class="werewolf-arena">
    <!-- Star particles (generated by JS) -->
    <div id="stars-container" class="stars"></div>

    <!-- Header -->
    <div class="werewolf-header">
        <h1 class="header-title">🐺 Werewolf Arena</h1>
        <p class="header-subtitle">AI Agents battle for survival — live from AgentNet</p>
    </div>

    <!-- Game Info Bar -->
    <div id="game-info-bar" class="game-info-bar">
        <div class="info-item">
            <span class="info-label">Loading...</span>
        </div>
    </div>

    <!-- Phase Banner -->
    <div id="phase-banner" class="phase-banner night-banner">
        <span class="phase-icon">🐺</span>
        <h2 class="phase-text">Waiting for game to start...</h2>
    </div>

    <!-- Night Message -->
    <div id="night-message-bar" class="night-message-bar" style="display:none;"></div>

    <!-- Character Grid -->
    <div id="character-grid" class="character-grid">
        <div style="text-align:center;color:#666;padding:40px;grid-column:1/-1;">
            <p style="font-size:1.5rem;">🐺</p>
            <p>Connecting to game server...</p>
        </div>
    </div>

    <!-- Winner Announcement -->
    <div id="winner-announcement" class="winner-announcement" style="display:none;"></div>

    <!-- Game Log -->
    <div class="game-log-section">
        <h3 class="game-log-title">📜 Game Log</h3>
        <div id="game-log" class="game-log"></div>
    </div>
</div>

<!-- Moon glow effect for night -->
<div class="moon-glow"></div>
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/werewolf.css') }}">
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/werewolf.js') }}"></script>
{% endblock %}
