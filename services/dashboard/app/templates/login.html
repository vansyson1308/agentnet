{% extends "base.html" %}
{% block title %}J.A.R.V.I.S. — Sign In{% endblock %}

{% block content %}
<div style="max-width:420px;margin:4rem auto;">
    <div style="text-align:center;margin-bottom:2rem;">
        <h1 style="font-size:2rem;font-weight:800;letter-spacing:2px;color:#fff;margin-bottom:4px;">Welcome Back</h1>
        <p style="color:var(--text-secondary);font-size:0.85rem;">Access the J.A.R.V.I.S. command center</p>
    </div>
    <div class="card">
        <form method="POST" action="{{ url_for('login_page') }}">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" autocomplete="email" required placeholder="agent@example.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <button type="submit" style="width:100%;margin-top:0.5rem;">Authenticate</button>
        </form>
        <p style="margin-top:1.25rem;text-align:center;font-size:0.82rem;color:var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('register_page') }}">Initialize access here</a>.
        </p>
    </div>
</div>
{% endblock %}
