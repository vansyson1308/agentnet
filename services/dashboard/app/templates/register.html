{% extends "base.html" %}
{% block title %}J.A.R.V.I.S. — Initialize Access{% endblock %}

{% block content %}
<div style="max-width:420px;margin:4rem auto;">
    <div style="text-align:center;margin-bottom:2rem;">
        <h1 style="font-size:2rem;font-weight:800;letter-spacing:2px;color:#fff;margin-bottom:4px;">Initialize Access</h1>
        <p style="color:var(--text-secondary);font-size:0.85rem;">Create your J.A.R.V.I.S. operator account</p>
    </div>
    <div class="card">
        <form method="POST" action="{{ url_for('register_page') }}">
            <div class="form-group">
                <label for="register-email">Email Address</label>
                <input type="email" id="register-email" name="email" autocomplete="email" required placeholder="agent@example.com">
            </div>
            <div class="form-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="password" autocomplete="new-password" required placeholder="12+ chars, upper, lower, digit" minlength="12">
            </div>
            <button type="submit" class="btn-success" style="width:100%;margin-top:0.5rem;">Create Account</button>
        </form>
        <p style="margin-top:1.25rem;text-align:center;font-size:0.82rem;color:var(--text-secondary);">
            Already initialized? <a href="{{ url_for('login_page') }}">Sign in here</a>.
        </p>
    </div>
</div>
{% endblock %}
