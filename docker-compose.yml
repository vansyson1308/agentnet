# =============================================================================
# docker-compose.yml = LOCAL DEVELOPMENT STACK ONLY (Compose project: agentnet-local)
#
# Owns its own Postgres, Redis, Jaeger and every AgentNet service with hot
# reload and obviously-fake dev secrets. It is NOT a production or staging
# definition:
#   * staging  -> docker-compose.staging.yml  (own project `agentnet-staging`,
#                 externally managed Postgres/Redis; see docs/DEPLOYMENT_ARCHITECTURE.md)
#   * production -> no Compose definition is current; the retired VPS files live
#                 under deploy/legacy-vps/ and refuse to run.
# The explicit `name:` below makes `docker compose down` scope to this project
# regardless of the checkout directory name (Compose labels resources with the
# project name and only removes what it labeled). Volume/network names are
# pinned so existing local data survives the project rename.
# =============================================================================
name: agentnet-local

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: agentnet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentnet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/registry/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentnet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentnet-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: agentnet-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentnet-network

  # Registry Service
  registry:
    build:
      context: ./services/registry
      dockerfile: Dockerfile
    container_name: agentnet-registry
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-agentnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentnet}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_jwt_secret_key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      JAEGER_AGENT_HOST: jaeger
      OTEL_EXPORTER_OTLP_PORT: 4318
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/registry/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agentnet-network

  # Payment Service
  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: agentnet-payment
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-agentnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentnet}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_jwt_secret_key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      JAEGER_AGENT_HOST: jaeger
      OTEL_EXPORTER_OTLP_PORT: 4318
      ENVIRONMENT: development
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/payment/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - agentnet-network

  # Auto-Refund Worker
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: agentnet-worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-agentnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentnet}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password}
      JAEGER_AGENT_HOST: jaeger
      OTEL_EXPORTER_OTLP_PORT: 4318
      ENVIRONMENT: development
      SIMULATION_TIMEOUT_SECONDS: ${SIMULATION_TIMEOUT_SECONDS:-3600}
      AGENT_BACKLOG_PATH: /app/AGENT_BACKLOG.md
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/worker:/app
      - ./AGENT_BACKLOG.md:/app/AGENT_BACKLOG.md
    command: python -m app.worker
    networks:
      - agentnet-network

  # Autonomous Society Runtime worker (v1). Shares the registry image so it
  # uses the same models/task_service/alembic schema. Disabled by default:
  # SOCIETY_RUNTIME_ENABLED=false makes it idle. The repo is mounted so the
  # Builder can create isolated git worktrees (only used when
  # SOCIETY_AUTONOMOUS_CODE_ENABLED=true). Production deploy is hard OFF.
  society-worker:
    build:
      context: ./services/registry
      dockerfile: Dockerfile
    container_name: agentnet-society-worker
    entrypoint: []
    command: python -m app.society.worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-agentnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentnet}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_jwt_secret_key}
      JAEGER_ENABLED: "false"
      ENVIRONMENT: development
      SOCIETY_RUNTIME_ENABLED: ${SOCIETY_RUNTIME_ENABLED:-false}
      SOCIETY_MODEL_PROVIDER: ${SOCIETY_MODEL_PROVIDER:-scripted}
      SOCIETY_MODEL_NAME: ${SOCIETY_MODEL_NAME:-}
      SOCIETY_MODEL_BASE_URL: ${SOCIETY_MODEL_BASE_URL:-}
      SOCIETY_MODEL_API_KEY: ${SOCIETY_MODEL_API_KEY:-}
      SOCIETY_MAX_RUNS_PER_HOUR: ${SOCIETY_MAX_RUNS_PER_HOUR:-120}
      SOCIETY_DAILY_MODEL_BUDGET: ${SOCIETY_DAILY_MODEL_BUDGET:-2.0}
      SOCIETY_MAX_CAUSATION_DEPTH: ${SOCIETY_MAX_CAUSATION_DEPTH:-12}
      SOCIETY_AUTONOMOUS_CODE_ENABLED: ${SOCIETY_AUTONOMOUS_CODE_ENABLED:-false}
      SOCIETY_STAGING_DEPLOY_ENABLED: ${SOCIETY_STAGING_DEPLOY_ENABLED:-false}
      SOCIETY_REPO_ROOT: /workspace/repo
      SOCIETY_WORKSPACE_ROOT: /tmp/agentnet-society-workspaces
      SOCIETY_METRICS_PORT: 9101
    volumes:
      - ./:/workspace/repo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_started
    networks:
      - agentnet-network

  # Simulation Service (MiroFish swarm simulation)
  simulation:
    build:
      context: ./services/simulation
      dockerfile: Dockerfile
    container_name: agentnet-simulation
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-agentnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentnet}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_jwt_secret_key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      JAEGER_AGENT_HOST: jaeger
      OTEL_EXPORTER_OTLP_PORT: 4318
      ENVIRONMENT: development
      REGISTRY_URL: http://registry:8000
      PAYMENT_URL: http://payment:8001
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      SIMULATION_TIMEOUT_SECONDS: ${SIMULATION_TIMEOUT_SECONDS:-3600}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/simulation/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    networks:
      - agentnet-network

  # Jaeger (tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.40
    container_name: agentnet-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: 9411
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP/gRPC (for tooling run outside compose)
      - "4318:4318"     # OTLP/HTTP — what the services export to
    volumes:
      - jaeger_data:/badger
    networks:
      - agentnet-network

  # Dashboard (local dev telemetry)
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: agentnet-dashboard
    environment:
      REGISTRY_URL: http://registry:8000
      PAYMENT_URL: http://payment:8001
      DASHBOARD_PORT: 8080
      AGENTNET_ADMIN_TOKEN: ${AGENTNET_USER_PASSWORD:-}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-flask-secret-do-not-use-in-prod}
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    depends_on:
      - registry
      - payment
    networks:
      - agentnet-network

volumes:
  postgres_data:
    name: agentnet_postgres_data   # pinned: pre-rename local data keeps working
  redis_data:
    name: agentnet_redis_data
  jaeger_data:
    name: agentnet_jaeger_data

networks:
  agentnet-network:
    name: agentnet-local
    driver: bridge
