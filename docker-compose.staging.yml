# AgentNet Staging — shares Postgres + Redis with prod (different DB
# schema agentnet_staging). Lives on the existing agentnet network.
# Ports offset by +100 so prod and staging coexist on the same host.
services:
  registry-staging:
    build: ./services/registry
    container_name: agentnet-staging-registry
    environment:
      POSTGRES_HOST: agentnet-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentnet_staging
      REDIS_HOST: agentnet-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: 3600
      JAEGER_ENABLED: "false"
      ENVIRONMENT: staging
      CORS_ALLOWED_ORIGINS: "https://staging.agentnet.io.vn,http://localhost:8180"
      RATE_LIMIT_PER_MINUTE: 60
    ports:
      - "8100:8000"
    # Inherits Dockerfile CMD which already runs uvicorn with
    # --proxy-headers --forwarded-allow-ips '*'.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - agentnet_agentnet-network

  payment-staging:
    build: ./services/payment
    container_name: agentnet-staging-payment
    environment:
      POSTGRES_HOST: agentnet-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentnet_staging
      REDIS_HOST: agentnet-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: 3600
      JAEGER_ENABLED: "false"
      ENVIRONMENT: staging
      CORS_ALLOWED_ORIGINS: "https://staging.agentnet.io.vn,http://localhost:8180"
    ports:
      - "8101:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agentnet_agentnet-network

  worker-staging:
    build: ./services/worker
    container_name: agentnet-staging-worker
    environment:
      POSTGRES_HOST: agentnet-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentnet_staging
      REDIS_HOST: agentnet-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JAEGER_ENABLED: "false"
      ENVIRONMENT: staging
      # Avoid prom port collision with prod worker (which already binds 9100
      # on its own container's loopback; both are isolated, but if anyone
      # ever exposes them they need different host ports).
      WORKER_METRICS_PORT: 9100
    command: python -m app.worker
    restart: unless-stopped
    networks:
      - agentnet_agentnet-network

  dashboard-staging:
    build: ./services/dashboard
    container_name: agentnet-staging-dashboard
    environment:
      REGISTRY_URL: http://agentnet-staging-registry:8000
      PAYMENT_URL: http://agentnet-staging-payment:8001
      DASHBOARD_PORT: 8080
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      BEHIND_PROXY: "true"
      ENVIRONMENT: staging
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agentnet_agentnet-network

networks:
  agentnet_agentnet-network:
    external: true
