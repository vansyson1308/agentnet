# =============================================================================
# AgentNet STAGING — standalone Compose project `agentnet-staging`
#
#   docker compose -f docker-compose.staging.yml config          # render/validate
#   docker compose -f docker-compose.staging.yml up -d --build   # project name comes from `name:` below
#   docker compose -f docker-compose.staging.yml down            # removes ONLY agentnet-staging resources
#
# Design rules (tests/test_compose_topology.py enforces them):
#   * This file is complete on its own. NEVER combine it with docker-compose.yml:
#     multiple -f files form ONE composite application, so the merged project
#     would own the local/prod services too.
#   * Postgres and Redis are EXTERNAL, managed dependencies addressed by
#     POSTGRES_HOST / REDIS_HOST (no container-name defaults, no lifecycle
#     ownership here). To reach infra that lives on another Compose project's
#     network on the same host, add the opt-in overlay
#     docker-compose.staging.shared-infra.yml.
#   * Every container is named agentnet-staging-*; no docker socket; no
#     published Society metrics port; Society runtime and autonomous code loop
#     OFF unless the operator sets them; no model credential default.
#   * Secrets come only from the deployment environment (.env on the host or
#     the platform's secret store). `:?` makes `docker compose config` fail fast
#     when a required value is missing.
# =============================================================================
name: agentnet-staging

x-staging-db: &staging-db
  POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must point at the managed staging database}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-agentnet_staging}

x-staging-redis: &staging-redis
  REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must point at the managed staging Redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

x-staging-common: &staging-common
  JAEGER_ENABLED: "false"
  ENVIRONMENT: staging
  # Staging has no SMTP. `log` is an explicit opt-in (never a fallback) and is
  # REFUSED in production; without it, registration answers 503 here.
  EMAIL_DELIVERY_PROVIDER: ${EMAIL_DELIVERY_PROVIDER:-log}
  # Which peers' X-Forwarded-* headers uvicorn trusts (the platform proxy).
  # Default loopback = trust nobody on the published port.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

services:
  registry-staging:
    build: ./services/registry
    container_name: agentnet-staging-registry
    environment:
      <<: [*staging-db, *staging-redis, *staging-common]
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: 3600
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (comma-separated public origins)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      # Society API (operator surfaces + world-event ingress). The runtime
      # itself lives in society-worker-staging; the API only reads state,
      # records approvals and accepts allow-listed world events.
      SOCIETY_OPERATOR_BOOTSTRAP_EMAILS: ${SOCIETY_OPERATOR_BOOTSTRAP_EMAILS:-}
      SOCIETY_MODEL_PROVIDER: ${SOCIETY_MODEL_PROVIDER:-scripted}
      SOCIETY_RUNTIME_ENABLED: ${SOCIETY_RUNTIME_ENABLED:-false}
      SOCIETY_AUTONOMOUS_CODE_ENABLED: ${SOCIETY_AUTONOMOUS_CODE_ENABLED:-false}
      SOCIETY_INGRESS_MAX_PER_ACTOR_PER_HOUR: ${SOCIETY_INGRESS_MAX_PER_ACTOR_PER_HOUR:-30}
      SOCIETY_INGRESS_MAX_PER_HOUR: ${SOCIETY_INGRESS_MAX_PER_HOUR:-120}
    ports:
      - "${STAGING_REGISTRY_PORT:-8100}:8000"
    # Inherits the Dockerfile CMD (uvicorn --proxy-headers); which peers'
    # X-Forwarded-* headers are trusted is decided ONLY by FORWARDED_ALLOW_IPS
    # (staging-common, default loopback) — nothing bakes in '*'.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - staging

  payment-staging:
    build: ./services/payment
    container_name: agentnet-staging-payment
    environment:
      <<: [*staging-db, *staging-redis, *staging-common]
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: 3600
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (comma-separated public origins)}
    ports:
      - "${STAGING_PAYMENT_PORT:-8101}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - staging

  worker-staging:
    build: ./services/worker
    container_name: agentnet-staging-worker
    environment:
      <<: [*staging-db, *staging-redis, *staging-common]
      WORKER_METRICS_PORT: 9100   # container-internal; never published
    command: python -m app.worker
    restart: unless-stopped
    networks:
      - staging

  # Autonomous Society Runtime worker (staging). OFF by default: with
  # SOCIETY_RUNTIME_ENABLED unset the process idles and touches nothing.
  # Hard rules: no docker socket, no published ports (metrics stay on the
  # project network), no production settings, and the production deploy
  # intent is not a setting at all (hard OFF in code).
  society-worker-staging:
    build: ./services/registry
    container_name: agentnet-staging-society-worker
    entrypoint: []
    command: python -m app.society.worker
    environment:
      <<: [*staging-db, *staging-redis, *staging-common]
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      SOCIETY_RUNTIME_ENABLED: ${SOCIETY_RUNTIME_ENABLED:-false}
      SOCIETY_AUTONOMOUS_CODE_ENABLED: ${SOCIETY_AUTONOMOUS_CODE_ENABLED:-false}
      SOCIETY_STAGING_DEPLOY_ENABLED: "false"
      # Live model: credential comes from the deployment environment only.
      # Never commit it; `python -m app.society.canary preflight` refuses
      # credentials that ever appeared in git history.
      SOCIETY_MODEL_PROVIDER: ${SOCIETY_MODEL_PROVIDER:-scripted}
      SOCIETY_MODEL_NAME: ${SOCIETY_MODEL_NAME:-}
      SOCIETY_MODEL_BASE_URL: ${SOCIETY_MODEL_BASE_URL:-}
      SOCIETY_MODEL_API_KEY: ${SOCIETY_MODEL_API_KEY:-}
      SOCIETY_MODEL_TIMEOUT_SECONDS: ${SOCIETY_MODEL_TIMEOUT_SECONDS:-45}
      SOCIETY_MODEL_REQUEST_RETRIES: ${SOCIETY_MODEL_REQUEST_RETRIES:-1}
      SOCIETY_MODEL_RETRY_BACKOFF_SECONDS: ${SOCIETY_MODEL_RETRY_BACKOFF_SECONDS:-2}
      # Phase 3 output-format negotiation + FAST/STRONG routing (names are config, never code)
      SOCIETY_MODEL_OUTPUT_FORMAT: ${SOCIETY_MODEL_OUTPUT_FORMAT:-auto}
      SOCIETY_MODEL_EMPTY_CONTENT_RETRIES: ${SOCIETY_MODEL_EMPTY_CONTENT_RETRIES:-1}
      # Phase 4.1 (ADR-0007): provider request-capability profile + explicit reasoning policy
      SOCIETY_MODEL_CAPABILITY_PROFILE: ${SOCIETY_MODEL_CAPABILITY_PROFILE:-generic}
      SOCIETY_MODEL_THINKING_MODE: ${SOCIETY_MODEL_THINKING_MODE:-auto}
      SOCIETY_MODEL_REASONING_EFFORT: ${SOCIETY_MODEL_REASONING_EFFORT:-auto}
      SOCIETY_MODEL_FAST_NAME: ${SOCIETY_MODEL_FAST_NAME:-}
      SOCIETY_MODEL_STRONG_NAME: ${SOCIETY_MODEL_STRONG_NAME:-}
      # cost governor
      SOCIETY_DAILY_MODEL_BUDGET: ${SOCIETY_DAILY_MODEL_BUDGET:-2.0}
      SOCIETY_MAX_CORRELATION_COST_USD: ${SOCIETY_MAX_CORRELATION_COST_USD:-0.50}
      SOCIETY_MAX_EXPERIMENT_COST_USD: ${SOCIETY_MAX_EXPERIMENT_COST_USD:-0.25}
      SOCIETY_MAX_PROMOTION_COST_USD: ${SOCIETY_MAX_PROMOTION_COST_USD:-0.25}
      SOCIETY_MAX_RUNS_PER_HOUR: ${SOCIETY_MAX_RUNS_PER_HOUR:-60}
      SOCIETY_MAX_RUNS_PER_CORRELATION: ${SOCIETY_MAX_RUNS_PER_CORRELATION:-40}
      SOCIETY_MAX_CAUSATION_DEPTH: ${SOCIETY_MAX_CAUSATION_DEPTH:-12}
      SOCIETY_APPROVAL_RESUME_MAX_ATTEMPTS: ${SOCIETY_APPROVAL_RESUME_MAX_ATTEMPTS:-3}
      SOCIETY_HEARTBEAT_INTERVAL_SECONDS: ${SOCIETY_HEARTBEAT_INTERVAL_SECONDS:-3600}
      # engineering bounds (repo intelligence + iterative loop)
      SOCIETY_MAX_ENGINEERING_TURNS: ${SOCIETY_MAX_ENGINEERING_TURNS:-6}
      SOCIETY_MAX_CORRELATION_ENGINEERING_TURNS: ${SOCIETY_MAX_CORRELATION_ENGINEERING_TURNS:-12}
      SOCIETY_MAX_REPO_READS_PER_RUN: ${SOCIETY_MAX_REPO_READS_PER_RUN:-5}
      SOCIETY_MAX_REPO_READS_PER_CORRELATION: ${SOCIETY_MAX_REPO_READS_PER_CORRELATION:-40}
      SOCIETY_MAX_REPO_BYTES_PER_RUN: ${SOCIETY_MAX_REPO_BYTES_PER_RUN:-120000}
      SOCIETY_MAX_SEARCH_RESULTS: ${SOCIETY_MAX_SEARCH_RESULTS:-40}
      SOCIETY_MAX_ENGINEERING_CORRELATION_DEPTH: ${SOCIETY_MAX_ENGINEERING_CORRELATION_DEPTH:-20}
      # change budget (independent of model spend)
      SOCIETY_MAX_AUTONOMOUS_CANDIDATES_PER_DAY: ${SOCIETY_MAX_AUTONOMOUS_CANDIDATES_PER_DAY:-10}
      SOCIETY_MAX_RED_CANDIDATES_PER_DAY: ${SOCIETY_MAX_RED_CANDIDATES_PER_DAY:-2}
      SOCIETY_MAX_PROMOTIONS_PER_DAY: ${SOCIETY_MAX_PROMOTIONS_PER_DAY:-10}
      SOCIETY_MAX_OPEN_AUTONOMOUS_PRS: ${SOCIETY_MAX_OPEN_AUTONOMOUS_PRS:-3}
      SOCIETY_MAX_FILES_PER_CANDIDATE: ${SOCIETY_MAX_FILES_PER_CANDIDATE:-8}
      SOCIETY_MAX_DIFF_LINES: ${SOCIETY_MAX_DIFF_LINES:-600}
      # promotion controller (shadow by default; the real provider is inert without a credential)
      SOCIETY_PROMOTION_PROVIDER: ${SOCIETY_PROMOTION_PROVIDER:-disabled}
      SOCIETY_AUTO_MERGE_ENABLED: "false"   # this stack never merges autonomously; the flag is not host-overridable here
      SOCIETY_MAX_AUTONOMOUS_MERGES_PER_DAY: ${SOCIETY_MAX_AUTONOMOUS_MERGES_PER_DAY:-1}
      SOCIETY_GITHUB_REPOSITORY: ${SOCIETY_GITHUB_REPOSITORY:-}
      SOCIETY_GITHUB_BASE_BRANCH: ${SOCIETY_GITHUB_BASE_BRANCH:-main}
      SOCIETY_GITHUB_API_URL: ${SOCIETY_GITHUB_API_URL:-https://api.github.com}
      # GitHub credential boundary: identifiers and a PATH only. The private
      # key file is mounted by the platform's secret store and read ONLY by
      # the credential provider inside this process; the installation token is
      # minted in memory. SOCIETY_GITHUB_TOKEN / *_PRIVATE_KEY_PEM are NEVER
      # written into a compose file — the platform injects them, if ever.
      SOCIETY_GITHUB_CREDENTIAL_PROVIDER: ${SOCIETY_GITHUB_CREDENTIAL_PROVIDER:-disabled}
      SOCIETY_GITHUB_APP_ID: ${SOCIETY_GITHUB_APP_ID:-}
      SOCIETY_GITHUB_INSTALLATION_ID: ${SOCIETY_GITHUB_INSTALLATION_ID:-}
      SOCIETY_GITHUB_APP_PRIVATE_KEY_FILE: ${SOCIETY_GITHUB_APP_PRIVATE_KEY_FILE:-}
      SOCIETY_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS: ${SOCIETY_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS:-300}
      SOCIETY_PROMOTION_LEASE_SECONDS: ${SOCIETY_PROMOTION_LEASE_SECONDS:-300}
      SOCIETY_PROMOTION_MAX_ATTEMPTS: ${SOCIETY_PROMOTION_MAX_ATTEMPTS:-5}
      SOCIETY_PROMOTION_POLL_INTERVAL_SECONDS: ${SOCIETY_PROMOTION_POLL_INTERVAL_SECONDS:-60}
      # fitness (offline) + deployment (no host exists; requests end blocked_external)
      SOCIETY_FITNESS_TEST_TIMEOUT_SECONDS: ${SOCIETY_FITNESS_TEST_TIMEOUT_SECONDS:-300}
      SOCIETY_DEPLOYMENT_PROVIDER: disabled
      SOCIETY_REPO_ROOT: /workspace/repo
      SOCIETY_WORKSPACE_ROOT: /var/lib/agentnet-society/workspaces
      SOCIETY_METRICS_PORT: 9101   # container-internal only (healthcheck); never published
      SOCIETY_WORKER_ID: staging-society-worker
      # The checkout is bind-mounted from the host; git refuses foreign-owned
      # repositories unless marked safe. Worktrees stay on agentnet-auto/*.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./:/workspace/repo
      - society_workspaces:/var/lib/agentnet-society/workspaces
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9101/metrics', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - staging

  dashboard-staging:
    build: ./services/dashboard
    container_name: agentnet-staging-dashboard
    environment:
      REGISTRY_URL: http://agentnet-staging-registry:8000
      PAYMENT_URL: http://agentnet-staging-payment:8001
      DASHBOARD_PORT: 8080
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY is required}
      BEHIND_PROXY: "true"
      ENVIRONMENT: staging
    ports:
      - "${STAGING_DASHBOARD_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - staging

volumes:
  society_workspaces:   # rendered as agentnet-staging_society_workspaces

networks:
  staging:              # rendered as agentnet-staging_staging; owned by this project only
    driver: bridge
